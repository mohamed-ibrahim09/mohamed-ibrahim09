<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" width="800" height="270" role="img" aria-label="Terminal: Mohamed Elhadad, DevOps Engineer at ALGOcas. Skills: AWS, Terraform, Docker, Kubernetes, CI/CD, Observability. Motto: Automate what repeats. Monitor what matters. Secure what scales.">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <!-- Typewriter reveal masks. 16s loop: each line types in, holds, then everything resets. -->
    <clipPath id="c1"><rect x="40" y="62" height="26" width="0">
      <animate attributeName="width" dur="16s" repeatCount="indefinite" keyTimes="0;0.03;0.07;0.95;1" values="0;0;760;760;0"/></rect></clipPath>
    <clipPath id="c2"><rect x="40" y="92" height="26" width="0">
      <animate attributeName="width" dur="16s" repeatCount="indefinite" keyTimes="0;0.09;0.19;0.95;1" values="0;0;760;760;0"/></rect></clipPath>
    <clipPath id="c3"><rect x="40" y="132" height="26" width="0">
      <animate attributeName="width" dur="16s" repeatCount="indefinite" keyTimes="0;0.24;0.30;0.95;1" values="0;0;760;760;0"/></rect></clipPath>
    <clipPath id="c4"><rect x="40" y="162" height="26" width="0">
      <animate attributeName="width" dur="16s" repeatCount="indefinite" keyTimes="0;0.32;0.46;0.95;1" values="0;0;760;760;0"/></rect></clipPath>
    <clipPath id="c5"><rect x="40" y="202" height="26" width="0">
      <animate attributeName="width" dur="16s" repeatCount="indefinite" keyTimes="0;0.50;0.58;0.95;1" values="0;0;760;760;0"/></rect></clipPath>
    <clipPath id="c6"><rect x="40" y="232" height="26" width="0">
      <animate attributeName="width" dur="16s" repeatCount="indefinite" keyTimes="0;0.60;0.80;0.95;1" values="0;0;760;760;0"/></rect></clipPath>
  </defs>

  <!-- window -->
  <rect x="1" y="1" width="798" height="268" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <rect x="1" y="1" width="798" height="36" rx="12" fill="#161b22"/>
  <rect x="1" y="25" width="798" height="12" fill="#161b22"/>
  <rect x="1" y="35" width="798" height="3" fill="url(#bar)"/>
  <circle cx="24" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="19" r="6" fill="#27c93f"/>
  <text x="400" y="24" text-anchor="middle" font-family="'Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="13" fill="#8b949e">mohamed@cloud: ~</text>

  <g font-family="'Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="16">
    <g clip-path="url(#c1)"><text x="40" y="82" fill="#3fb950">$ <tspan fill="#c9d1d9">whoami</tspan></text></g>
    <g clip-path="url(#c2)"><text x="40" y="112" fill="#a78bfa" font-weight="bold">Mohamed Elhadad <tspan fill="#8b949e" font-weight="normal">·</tspan> <tspan fill="#c9d1d9" font-weight="normal">DevOps Engineer @ ALGOcas</tspan></text></g>

    <g clip-path="url(#c3)"><text x="40" y="152" fill="#3fb950">$ <tspan fill="#c9d1d9">cat stack.txt</tspan></text></g>
    <g clip-path="url(#c4)"><text x="40" y="182" fill="#79c0ff">AWS · Terraform · Docker · Kubernetes · CI/CD · Observability</text></g>

    <g clip-path="url(#c5)"><text x="40" y="222" fill="#3fb950">$ <tspan fill="#c9d1d9">echo $MOTTO</tspan></text></g>
    <g clip-path="url(#c6)"><text x="40" y="252" fill="#d2a8ff">Automate what repeats. Monitor what matters. Secure what scales.</text></g>

    <!-- blinking cursor -->
    <rect x="668" y="238" width="9" height="18" fill="#c9d1d9">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>

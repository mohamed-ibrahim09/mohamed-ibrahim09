<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="ft fd">
<title id="ft">How each project works</title>
<desc id="fd">aws-backup-disaster-recovery: EC2 web server to KMS vault to Vault Lock to Copy to region 2 to Restore to HTTP 200. AWS-Agentic-Travel-Assistant: Cognito to API Gateway to Lambda to Bedrock agent to Knowledge base. AWS-Cloud-Infrastructure-Dashboard: Users to Load balancer to Auto Scaling to React + FastAPI to CloudWatch.</desc>
<style>svg{--bg:#ffffff;--bdr:#d0d7de;--node:#f6f8fa;--txt:#1f2328;--mut:#59636e;--grn:#1a7f37;--glow:#dafbe1;--key:#0550ae}@media (prefers-color-scheme:dark){svg{--bg:#0d1117;--bdr:#30363d;--node:#161b22;--txt:#e6edf3;--mut:#8b949e;--grn:#3fb950;--glow:#12261e;--key:#79c0ff}}text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;font-size:13px;fill:var(--txt)}.card{fill:var(--bg);stroke:var(--bdr)}.node{fill:var(--node);stroke:var(--bdr)}.edge{stroke:var(--bdr);stroke-width:2;fill:none}.lit-n{fill:var(--glow);stroke:var(--grn)}.lit-e{stroke:var(--grn);stroke-width:2;fill:none}.repo{fill:var(--key);font-weight:700}.note{fill:var(--mut);font-size:12px}.chk{fill:var(--grn);font-weight:700}.lit{opacity:0;animation:lit 8s linear infinite}@keyframes lit{0%{opacity:0}4%,88%{opacity:1}96%,100%{opacity:0}}@media (prefers-reduced-motion:reduce){.lit{animation:none;opacity:1}}</style>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img" aria-labelledby="t d">
<title id="t">A load-balanced cloud app surviving a zone failure</title>
<desc id="d">A looping illustration. Users send traffic through a load balancer to two Availability Zones. Healthy. Traffic is balanced across two Availability Zones. az-a fails. The load balancer stops sending it traffic. Auto Scaling launches replacement capacity in the healthy zone. az-a recovers and rejoins the pool. A backup copies to region 2 and restores. The site answers HTTP 200.</desc>
<style>svg{--bg:#ffffff;--bdr:#d0d7de;--node:#f6f8fa;--panel:#fafbfc;--txt:#1f2328;--mut:#59636e;--grn:#1a7f37;--glow:#dafbe1;--red:#cf222e;--redbg:#ffebe9;--pur:#8250df;--purbg:#fbefff;--amb:#bf8700}@media (prefers-color-scheme:dark){svg{--bg:#0d1117;--bdr:#30363d;--node:#161b22;--panel:#0f141b;--txt:#e6edf3;--mut:#8b949e;--grn:#3fb950;--glow:#12261e;--red:#f85149;--redbg:#2d1214;--pur:#a371f7;--purbg:#1f1633;--amb:#d29922}}text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;font-size:12px;fill:var(--txt)}.card{fill:var(--bg);stroke:var(--bdr)}.panel{fill:var(--panel);stroke:var(--bdr)}.az{fill:none;stroke:var(--bdr);stroke-dasharray:4 4}.node{fill:var(--node);stroke:var(--bdr)}.slot{fill:none;stroke:var(--bdr);stroke-dasharray:3 3}.bar{fill:var(--bdr)}.led{fill:var(--grn)}.mut{fill:var(--mut)}.edge{stroke:var(--bdr);stroke-width:2}.dash{stroke:var(--bdr);stroke-width:2;stroke-dasharray:5 5}.pk{fill:var(--grn)}.pk2{fill:var(--pur)}.lb{fill:var(--glow);stroke:var(--grn);stroke-width:2}.failpanel{fill:var(--redbg);stroke:var(--red);stroke-width:1.5}.failtxt{fill:var(--red);font-weight:700}.dim{fill:var(--bg);opacity:.7}.redled{fill:var(--red)}.vbox{fill:var(--node);stroke:var(--bdr);stroke-width:2}.vlit{fill:var(--purbg);stroke:var(--pur);stroke-width:2}.vkey{fill:var(--pur)}.ok{fill:var(--grn)}.oktxt{fill:#ffffff;font-weight:700}.capbar{fill:var(--node);stroke:var(--bdr)}.captxt{font-size:13px}.sp{opacity:0}@keyframes c0{0%{opacity:1}23%{opacity:1}23.8%{opacity:0}100%{opacity:0}}.c0{animation:c0 16s linear infinite}@keyframes c1{0%{opacity:0}24.2%{opacity:0}25%{opacity:1}38%{opacity:1}38.8%{opacity:0}100%{opacity:0}}.c1{animation:c1 16s linear infinite}@keyframes c2{0%{opacity:0}39.2%{opacity:0}40%{opacity:1}58%{opacity:1}58.8%{opacity:0}100%{opacity:0}}.c2{animation:c2 16s linear infinite}@keyframes c3{0%{opacity:0}59.2%{opacity:0}60%{opacity:1}70%{opacity:1}70.8%{opacity:0}100%{opacity:0}}.c3{animation:c3 16s linear infinite}@keyframes c4{0%{opacity:0}71.2%{opacity:0}72%{opacity:1}95%{opacity:1}95.8%{opacity:0}100%{opacity:0}}.c4{animation:c4 16s linear infinite}@keyframes fail{0%{opacity:0}24.2%{opacity:0}25%{opacity:1}70%{opacity:1}70.8%{opacity:0}100%{opacity:0}}.fail{animation:fail 16s linear infinite}@keyframes newsrv{0%{opacity:0}41.2%{opacity:0}42%{opacity:1}96%{opacity:1}96.8%{opacity:0}100%{opacity:0}}.newsrv{animation:newsrv 16s linear infinite}@keyframes bk{0%{opacity:0}71.2%{opacity:0}72%{opacity:1}94%{opacity:1}94.8%{opacity:0}100%{opacity:0}}.bk{animation:bk 16s linear infinite}@keyframes vault{0%{opacity:0}73.2%{opacity:0}74%{opacity:1}96%{opacity:1}96.8%{opacity:0}100%{opacity:0}}.vault{animation:vault 16s linear infinite}@keyframes badge{0%{opacity:0}87.2%{opacity:0}88%{opacity:1}96%{opacity:1}96.8%{opacity:0}100%{opacity:0}}.badge{animation:badge 16s linear infinite}@keyframes aflow{0%{opacity:1}24%{opacity:1}24.8%{opacity:0}69.2%{opacity:0}70%{opacity:1}100%{opacity:1}}.aflow{animation:aflow 16s linear infinite}@keyframes m1{0%{transform:translate(0,0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translate(106px,0px);opacity:0}}.m1{animation:m1 2s linear infinite}@keyframes m2{0%{transform:translate(0,0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translate(124px,-56px);opacity:0}}.m2{animation:m2 2s linear infinite}@keyframes m3{0%{transform:translate(0,0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translate(124px,58px);opacity:0}}.m3{animation:m3 2s linear infinite}@keyframes m4{0%{transform:translate(0,0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translate(96px,-8px);opacity:0}}.m4{animation:m4 2s linear infinite}@media (prefers-reduced-motion:reduce){.sp,.c0,.c1,.c2,.c3,.c4,.fail,.newsrv,.bk,.vault,.badge,.aflow{animation:none!important}.c0,.c1,.c2,.c3,.fail,.bk,.pk,.pk2{opacity:0!important}.c4,.newsrv,.vault,.badge,.aflow{opacity:1!important}}</style>
